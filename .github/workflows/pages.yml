name: Build and deploy archive
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Reconcile, validate and package archive
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-sync.txt
      - name: Restore encrypted synchronization checkpoint
        if: github.event_name != 'pull_request'
        run: python scripts/website_state.py pull
      - name: Reconcile current public Ghost posts and pages
        if: github.event_name != 'pull_request'
        env:
          MOO_ASSET_CACHE_KEY: ${{ secrets.MOO_ASSET_CACHE_KEY }}
        run: |
          python scripts/website_sync.py
          python scripts/check_website_sync.py
      - name: Save encrypted revisions and stable mappings
        if: always() && github.event_name != 'pull_request'
        run: python scripts/website_state.py push
      - name: Build and verify archive
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://archive.museumofone.art' }}
        run: |
          python scripts/build.py
          python scripts/check.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
          python scripts/stewardship.py --verify
      - name: Publish reconciliation summary
        if: always()
        run: |
          if [ -f .sync-work/report.json ]; then
            python scripts/website_report.py >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Publish GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
