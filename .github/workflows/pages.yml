name: Build and deploy archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    name: Validate and package archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-verification test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Build and verify archive
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://archive.museumofone.art' }}
        run: |
          python scripts/build.py
          python scripts/check.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
          python scripts/stewardship.py --verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Publish GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
